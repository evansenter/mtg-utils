name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest is the only dev dependency. mtg_utils itself is standard
      # library only, so there is nothing else to install and nothing to
      # pin -- that is deliberate, not an omission.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # No network. Every test runs off the frozen fixtures in
      # tests/fixtures/; anything that needed Scryfall or Moxfield would
      # need a fixture instead.
      - name: Run the suite
        env:
          # set iteration order depends on the hash seed. The golden suite
          # runs both copies in one process so any effect is shared, but
          # pinning it keeps a failure reproducible from the log.
          PYTHONHASHSEED: "0"
        run: python -m pytest tests/ -q --durations=5

      - name: Check the CLI still starts
        run: |
          python3 mana_model.py --help > /dev/null
          python3 -m mtg_utils --help > /dev/null
